{% extends "base.html" %}
{% block content %}
<section class="wrap wide">
  <h1>Gallery</h1>
  <div class="gallery">
    {% for p in pictures %}
    <a href="{{ url_for('picture', picture_id=p.id) }}" target="_blank" rel="noopener">
        <img
             src="{{ url_for('picture', picture_id=p.id) }}"
             alt="{{ p.filename }}"
             loading="lazy">
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
