{% extends "base.html" %}
{% block content %}
<section class="wrap wide">
  <h1>Gallery</h1>
  <div class="gallery">
    {% for p in photos %}
    <a href="{{ img(p) }}" target="_blank" rel="noopener">
      <img src="{{ img(p) }}" alt="Old Millstone Forge photo {{ loop.index }}" loading="lazy">
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
