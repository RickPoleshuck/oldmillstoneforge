<footer class="site-footer">
<table>
    <tr>
        <td class="map">
            <iframe style="max-height: 200px; max-width: 500px;" src="{{ site.map_embed }}" title="Map to the Old Millstone Forge" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </td>
        <td>
            <div>
                {% for line in site.address %}{{ line }}{% if not loop.last %}<br>{% endif %}{% endfor %}
            </div>
            <div>
            <a class="footer-links" href="mailto:{{ site.email }}">{{ site.email }}</a>
            </div>
        </td>
    </tr>
    <tr>
        <td colspan="2" class="copyright">
            <div>&copy; Old Millstone Forge Association</div>
        </td>
    </tr>
</table>
</footer>
