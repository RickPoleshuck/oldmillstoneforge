{% extends "base.html" %}
{% block content %}
<section class="wrap narrow">
  <h1>Old Millstone Forge Chronicles</h1>
    <table class="chronicles">
        <tr>
            <th>Date</th><th>Name</th><th>Download</th>
        </tr>
        {% for item in items %}
            <tr>
                <td>item.date</td>
                <td>item.filename</td>
                <td>
                    <a href="{{ url_for('download_pdf', doc_id=item.id) }}">
                        <img src="{{ img('newsletter.png') }}" alt="" width="48" height="48">/td>
                    </a>
            </tr>
         {% endfor %}
    </table>
</section>
{% endblock %}
