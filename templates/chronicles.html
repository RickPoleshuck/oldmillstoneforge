{% extends "base.html" %}
{% block content %}
    <section class="wrap">
        <h1>Old Millstone Forge Chronicles</h1>
        {%  if is_admin %}
            <form action="{{ url_for('add_chronicle') }}" method="post" enctype="multipart/form-data">
                <input type="file" name="pdf" accept="application/pdf" required>
                <input type="date" name="date" required>
                <button type="submit">Add chronicle</button>
            </form>

        {% endif %}
        <table class="chronicles zebra">
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Download</th>
                {% if is_admin %}
                    <th></th>
                {% endif %}
            </tr>
            {% for item in items %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.date.strftime("%B %d, %Y") }}</td>
                    <td>
                        <button onclick="window.open('{{ url_for('download_pdf', doc_id=item.id) }}', '_blank')">
                            <img src="{{ img('chronicles.png') }}" alt="" width="30" height="30">
                        </button>
                    </td>
                    {% if is_admin %}
                        <td>
                            <form action="{{ url_for('delete_chronicle', item_id=item.id) }}" method="POST"
                                  onsubmit="return confirm('Are you sure you want to delete item {{ item.id }}?');">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fa-solid fa-trash" aria-hidden="true"></i>
                                </button>
                            </form>
                        </td>
                    {% endif %}
                </tr>
            {% endfor %}
        </table>
    </section>
{% endblock %}
