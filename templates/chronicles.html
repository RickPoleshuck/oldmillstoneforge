{% extends "base.html" %}
{% block content %}
<section class="wrap narrow">
  <h1>Old Millstone Forge Chronicles</h1>
    <table class="chronicles zebra">
        <tr>
            <th>Date</th><th>Download</th>
        </tr>
        {% for item in items %}
            <tr>
                <td>{{ item.date.strftime("%B %d, %Y") }}</td>
                <td>
                    <button onclick="window.open('{{ url_for('download_pdf', doc_id=item.id) }}', '_blank')">
                        <img src="{{ img('chronicles.png') }}" alt="" width="30" height="30">
                    </button>
                </td>
            </tr>
         {% endfor %}
    </table>
</section>
{% endblock %}
