name: Continuous Integration

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Speeds up subsequent runs by caching dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install build
        pip install -r requirements.txt

    - name: Analysing the code with pylint
      run: |
        pylint --rcfile=pyproject.toml $(git ls-files '*.py') --fail-under=9.5

    - name: Copy to server
      if: github.ref == 'refs/heads/main'
      uses: burnett01/rsync-deployments@v9
      with:
        switches: -avzr --delete --exclude \*.db --exclude .venv --exclude __pycache__ --exclude .git --exclude .gitignore --exclude .idea
        path: .
        remote_path: oldmillstoneforge/web
        remote_host: oldmillstoneforge.mooo.com
        remote_port: 3922
        remote_user: omf
        remote_key: ${{ secrets.SSH_PRIVATE_KEY  }}

    - name: Restart server
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@master
      with:
        host: oldmillstoneforge.mooo.com
        port: 3922
        username: omf
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: systemctl --user restart oldmillstoneforge

    - name: 🔍 Wait for website to restart
      if: github.ref == 'refs/heads/main'
      uses: jtalk/url-health-check-action@v5
      with:
        url: https://oldmillstoneforge.mooo.com
        max-attempts: 30
        retry-delay: 10s
